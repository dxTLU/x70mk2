# The proxy behind Varnish, in containers.
#
#   docker compose up -d --build        # then open http://<this machine>:6081/
#   BASIC_AUTH=me:secret docker compose up -d
#   PUBLIC_PORT=80 docker compose up -d
#
# Varnish shares the app container's network namespace, so the unmodified VCL reaches the app on
# 127.0.0.1:8080 and only Varnish's port is published. The varnishd parameters repeat
# varnish/varnishd.params (keep in sync; test/varnish.test.js checks).

services:
  proxy:
    build: .
    image: x70mk2-proxy
    restart: unless-stopped
    environment:
      HOST: 127.0.0.1
      PORT: "8080"
      BASIC_AUTH: ${BASIC_AUTH:-}
      SEARCH_URL: ${SEARCH_URL:-https://duckduckgo.com/?q=%s}
      UPSTREAM_PROXY: ${UPSTREAM_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      ALLOW_PRIVATE: ${ALLOW_PRIVATE:-0}
      TOOLBAR: ${TOOLBAR:-1}
      LOG_REQUESTS: ${LOG_REQUESTS:-0}
    volumes:
      - sessions:/data
    ports:
      # Published here because Varnish uses this container's network.
      - "${PUBLIC_PORT:-6081}:6081"

  varnish:
    image: varnish:7
    restart: unless-stopped
    network_mode: "service:proxy"
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    environment:
      VARNISH_HTTP_PORT: "6081"
      VARNISH_SIZE: ${VARNISH_SIZE:-256M}
    # Appended to the image's varnishd command line (-F -f /etc/varnish/default.vcl ...).
    command:
      - -p
      - http_req_hdr_len=65536
      - -p
      - http_req_size=131072
      - -p
      - workspace_client=262144
      - -p
      - http_resp_hdr_len=65536
      - -p
      - http_resp_size=131072
      - -p
      - workspace_backend=262144
      - -p
      - http_max_hdr=256
      - -p
      - send_timeout=86400
      - -p
      - pipe_timeout=3600

volumes:
  sessions:
