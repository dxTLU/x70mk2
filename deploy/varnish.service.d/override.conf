# Drop-in for the distribution's varnish.service: Varnish on port 6081 in front of the proxy app,
# with the proxy's VCL and the runtime parameters from varnish/varnishd.params (keep in sync;
# test/varnish.test.js checks).
#
# Install (deploy/install.sh does this):
#   sudo mkdir -p /etc/systemd/system/varnish.service.d
#   sudo cp deploy/varnish.service.d/override.conf /etc/systemd/system/varnish.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart varnish
#
# The VCL must live outside /home (the stock unit sets ProtectHome) and be readable by Varnish's
# user. Debian/Ubuntu run Varnish as "vcache"; on RHEL/Fedora use -j unix,user=varnish.
# To serve port 80 instead, change "-a :6081" to "-a :80".

[Unit]
Wants=x70mk2-proxy.service
After=x70mk2-proxy.service

[Service]
ExecStart=
ExecStart=/usr/sbin/varnishd \
          -j unix,user=vcache \
          -F \
          -a :6081 \
          -T localhost:6082 \
          -f /opt/x70mk2/varnish/default.vcl \
          -S /etc/varnish/secret \
          -s malloc,256m \
          -p http_req_hdr_len=65536 \
          -p http_req_size=131072 \
          -p workspace_client=262144 \
          -p http_resp_hdr_len=65536 \
          -p http_resp_size=131072 \
          -p workspace_backend=262144 \
          -p http_max_hdr=256 \
          -p send_timeout=86400 \
          -p pipe_timeout=3600
